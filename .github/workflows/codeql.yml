name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    # Code scanning on a private repository needs GitHub Advanced Security, which this
    # organization's plan doesn't include, so the job only runs once the repository is
    # public. Scheduled runs carry no repository payload: set the CODE_SCANNING repository
    # variable to "enabled" to keep the weekly scan.
    if: github.event.repository.visibility == 'public' || vars.CODE_SCANNING == 'enabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4