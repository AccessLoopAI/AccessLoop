name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    # Dependency review on a private repository needs GitHub Advanced Security (see codeql.yml).
    if: github.event.repository.visibility == 'public' || vars.CODE_SCANNING == 'enabled'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high